name: Actualizar Estatuto BOE

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas
        run: pip install beautifulsoup4

      - name: Ejecutar descarga del BOE
        run: python actualizar_boe.py

      - name: Guardar cambios si el texto ha cambiado
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ESTATUTO_TRABAJADORES.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática desde el BOE" && git push)
